<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" font-family="Menlo, Consolas, monospace" font-size="11" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<marker id="tri" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1,1 L12,7 L1,13 Z" fill="#fff" stroke="#222"/></marker>
<marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#222"/></marker>
</defs>
<rect width="980" height="500" fill="#fff"/>
<text x="490" y="18" text-anchor="middle" font-size="14" font-weight="bold">Diagramme UML – Gestion_Biblio_CHCL</text>

<!-- Adherent -->
<g stroke="#222" fill="#eef4ff"><rect x="10" y="40" width="280" height="190"/><line x1="10" y1="66" x2="290" y2="66"/><line x1="10" y1="130" x2="290" y2="130"/></g>
<g fill="#111"><text x="150" y="58" text-anchor="middle" font-weight="bold" font-size="13">Adherent</text>
<text x="18" y="88">+ nom: String (private set)</text>
<text x="18" y="108">+ livresEmpruntes: [Livre] (private set)</text>
<text x="18" y="150">+ emprunterLivre(_ livre: Livre)</text><text x="18" y="166">+ retournerLivre(_ livre: Livre)</text><text x="18" y="182">+ afficherEmprunts()</text></g>

<!-- Livre -->
<g stroke="#222" fill="#fff7e6"><rect x="360" y="40" width="260" height="190"/><line x1="360" y1="66" x2="620" y2="66"/><line x1="360" y1="130" x2="620" y2="130"/></g>
<g fill="#111"><text x="490" y="58" text-anchor="middle" font-weight="bold" font-size="13">Livre</text>
<text x="368" y="84">+ titre: String (private set)</text><text x="368" y="100">+ auteur: String (private set)</text><text x="368" y="116">+ estDisponible: Bool (private set)</text>
<text x="368" y="150">+ afficherInformations()</text><text x="368" y="166">+ emprunter() -> Bool</text><text x="368" y="182">+ retourner() -> Bool</text></g>

<!-- Bibliotheque -->
<g stroke="#222" fill="#eafaf0"><rect x="690" y="40" width="280" height="190"/><line x1="690" y1="66" x2="970" y2="66"/><line x1="690" y1="130" x2="970" y2="130"/></g>
<g fill="#111"><text x="830" y="58" text-anchor="middle" font-weight="bold" font-size="13">Bibliotheque</text>
<text x="698" y="88">+ livres: [Livre] (private set)</text>
<text x="698" y="150">+ ajouterLivre(_ livre: Livre)</text><text x="698" y="166">+ afficherCatalogue()</text><text x="698" y="182">+ rechercherLivre(titre:) -> Livre?</text></g>

<!-- LivrePapier -->
<g stroke="#222" fill="#fff7e6"><rect x="150" y="320" width="290" height="110"/><line x1="150" y1="346" x2="440" y2="346"/><line x1="150" y1="386" x2="440" y2="386"/></g>
<g fill="#111"><text x="295" y="338" text-anchor="middle" font-weight="bold" font-size="13">LivrePapier</text>
<text x="158" y="368">+ nombrePages: Int (private set)</text><text x="158" y="408">+ afficherInformations() (override)</text></g>

<!-- LivreNumerique -->
<g stroke="#222" fill="#fff7e6"><rect x="540" y="320" width="290" height="110"/><line x1="540" y1="346" x2="830" y2="346"/><line x1="540" y1="386" x2="830" y2="386"/></g>
<g fill="#111"><text x="685" y="338" text-anchor="middle" font-weight="bold" font-size="13">LivreNumerique</text>
<text x="548" y="368">+ tailleFichierMo: Double (private set)</text><text x="548" y="408">+ afficherInformations() (override)</text></g>

<g stroke="#222" fill="none" stroke-width="1.4">
<line x1="295" y1="320" x2="470" y2="232" marker-end="url(#tri)"/>
<line x1="685" y1="320" x2="510" y2="232" marker-end="url(#tri)"/>
<line x1="290" y1="135" x2="360" y2="135" marker-end="url(#arr)"/>
<line x1="690" y1="135" x2="620" y2="135" marker-end="url(#arr)"/>
</g>
<g fill="#111"><text x="325" y="126" text-anchor="middle">0..3</text><text x="655" y="126" text-anchor="middle">0..*</text>
<text x="325" y="152" text-anchor="middle">emprunte</text><text x="655" y="152" text-anchor="middle">contient</text>
<text x="490" y="470" text-anchor="middle">Triangle blanc = héritage (extends) · Flèche simple = association · private set = lecture seule depuis l'extérieur</text></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
